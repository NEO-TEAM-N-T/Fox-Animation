name: probe
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1
      - name: Unpack project and assets
        run: |
          shopt -s nullglob
          for z in code-packs/*.zip; do unzip -o -q "$z" -d .; done
          mkdir -p src/main/resources
          for z in asset-packs/*.zip; do unzip -o -q "$z" -d src/main/resources; done
      - name: Resolve GeckoLib and ModMenu versions
        run: |
          get() { curl -sf -A "Fox-Animation-CI" -G "https://api.modrinth.com/v2/project/$1/version" --data-urlencode 'loaders=["fabric"]' "${@:2}" | jq -r '.[0].id // empty'; }
          GL=$(get geckolib --data-urlencode 'game_versions=["26.3"]')
          MM=$(get modmenu --data-urlencode 'game_versions=["26.3"]')
          [ -n "$MM" ] || MM=$(get modmenu)
          echo "geckolib_version=$GL" >> gradle.properties
          echo "modmenu_version=$MM" >> gradle.properties
      - run: gradle build --no-daemon || true
      - name: Probe item and registry classes
        run: |
          JAR=~/.gradle/caches/fabric-loom/26.3/minecraft-merged.jar
          unzip -l "$JAR" | awk '{print $4}' | grep -E '/(Item|Items|SpawnEggItem|SpawnEgg|ItemStack|ItemUseAnimation|CreativeModeTab|CreativeModeTabs|CustomData|Equippable|EquipmentSlot|DataComponents|BuiltInRegistries|Registry|ResourceKey|InteractionResult|BlockItem|ItemNameBlockItem|EntityType|WrittenBookContent|BookViewScreen|UseRemainder)\.class$' > want.txt || true
          unzip -l "$JAR" | awk '{print $4}' | grep -E 'Item\$Properties\.class$|CreativeModeTab\$Builder\.class$|EntityType\$Builder\.class$' >> want.txt || true
          while read -r c; do
            n="${c%.class}"; n="${n//\//.}"
            echo; echo "##### $n"
            javap -p -cp "$JAR" "$n" | grep -vE 'lambda\$|^\s*private|synthetic' | cut -c1-260 || true
          done < want.txt
      - name: Probe Fabric API
        run: |
          for j in $(find ~/.gradle -name '*.jar' | grep -iE 'fabric-(item-group|data-attachment|object-builder|registry-sync|item-api|networking-api|command-api|entity-events|events-interaction)'); do
            echo "--- $j"
            unzip -l "$j" | awk '{print $4}' | grep -E '\.class$' | grep -vE 'impl|mixin|test' | head -60
            unzip -l "$j" | awk '{print $4}' | grep -E '/(ItemGroupEvents|FabricItemGroup|AttachmentRegistry|AttachmentType|AttachmentSyncPredicate|FabricItemSettings|ServerPlayNetworking|PayloadTypeRegistry|ServerLivingEntityEvents|UseEntityCallback)\.class$' > fw.txt || true
            while read -r c; do
              n="${c%.class}"; n="${n//\//.}"
              echo; echo "##### FABRIC $n"
              javap -p -cp "$j" "$n" | grep -vE 'lambda\$|^\s*private' | cut -c1-240 || true
            done < fw.txt
          done
